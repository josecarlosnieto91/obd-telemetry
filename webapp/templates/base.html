<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    {% if api_token %}<meta name="api-token" content="{{ api_token }}">{% endif %}
    <title>{% block title %}OBD Telemetry{% endblock %}</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
    <!-- Chart.js LOCAL (static/): antes venía de jsdelivr y el gráfico del
         dashboard se quedaba vacío cuando la tablet no tenía Internet, que es
         justo el caso normal conduciendo. -->
    <script src="/static/chart.umd.min.js?v={{ static_v }}"></script>
    <!-- Navegación con mando + «Inicio»: el kiosco muestra esta app en un iframe,
         y sin esto dentro de Coches/OBD no se puede navegar ni volver con el mando -->
    <script src="/static/nav.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="nav-brand" style="text-decoration:none;">🚗 OBD<span>Telemetry</span></a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menú">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="/" {% if request.path == '/' %}class="active" aria-current="page"{% endif %}>Dashboard</a>
            <a href="/trips" {% if 'trips' in request.path %}class="active" aria-current="page"{% endif %}>Viajes</a>
            <a href="/alerts" {% if 'alerts' in request.path %}class="active" aria-current="page"{% endif %}>Alertas</a>
            <a href="/dtcs" {% if 'dtcs' in request.path %}class="active" aria-current="page"{% endif %}>DTCs</a>
            <a href="/map" {% if 'map' in request.path %}class="active" aria-current="page"{% endif %}>Mapa</a>
            <a href="/refuels" {% if 'refuels' in request.path %}class="active" aria-current="page"{% endif %}>Repostajes</a>
            <a href="/consumo" {% if 'consumo' in request.path %}class="active" aria-current="page"{% endif %}>Consumo</a>
            <a href="/maintenance" {% if 'maintenance' in request.path %}class="active" aria-current="page"{% endif %}>Consejos</a>
        </div>
        <div class="nav-status" id="nav-status" role="status" aria-live="polite">● Desconectado</div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        // POST con token: los endpoints que cambian datos del coche (marcar
        // DTCs, reconocer alertas, litros, servicios) exigen la cabecera
        // X-OBD-Token. El valor viene del config (webapp.api_token) por meta.
        window.apiPost = function (url, cuerpo) {
            const meta = document.querySelector('meta[name="api-token"]');
            const headers = { 'Content-Type': 'application/json' };
            if (meta) headers['X-OBD-Token'] = meta.content;
            return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(cuerpo || {}) });
        };

        // Menú hamburguesa (móvil)
        document.getElementById('nav-toggle').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('open');
        });

        // Connection status indicator in nav — con la FRESCURA del dato: sin
        // esto el panel pinta valores de hace semanas igual que los de ahora.
        setInterval(async () => {
            try {
                const r = await fetch('/api/status');
                const d = await r.json();
                const el = document.getElementById('nav-status');
                if (d.connected) {
                    const fresco = d.frescura || {};
                    const viejo = fresco.estado === 'viejo' || fresco.estado === 'obsoleto';
                    const marca = viejo ? '⚠️' : '●';
                    el.textContent = `${marca} ${d.speed || 0} km/h${fresco.etiqueta ? ' · ' + fresco.etiqueta : ''}`;
                    el.className = 'nav-status ' + (viejo ? 'stale' : 'online');
                    el.title = 'Última lectura: ' + (fresco.ts || '—');
                } else {
                    el.textContent = '● Sin datos';
                    el.className = 'nav-status';
                }
            } catch(e) {
                document.getElementById('nav-status').textContent = '● Error';
            }
        }, 5000);
    </script>
    <script>
        // PWA: la tablet puede instalarla y, sin red, ver la última copia.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
