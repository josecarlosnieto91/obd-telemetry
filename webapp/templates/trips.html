{% extends "base.html" %}
{% block title %}Viajes — OBD Telemetry{% endblock %}

{% block content %}
<div class="page">
    <h1>Historial de Viajes</h1>
    <div class="filter-bar">
        <label class="muted" for="f-desde">Desde</label>
        <input type="date" id="f-desde">
        <label class="muted" for="f-hasta">Hasta</label>
        <input type="date" id="f-hasta">
        <button class="btn" onclick="aplicarFechas()">Filtrar</button>
        <button class="btn" onclick="limpiarFechas()">Todo</button>
        <span class="muted" id="trips-resumen"></span>
    </div>
    <div id="trips-list">
        <p class="muted">Cargando viajes...</p>
    </div>
    <p style="margin-top:12px;"><button class="btn" id="mas-trips" style="display:none"
        onclick="loadTrips(false)">Cargar más viajes</button></p>
</div>

<!-- Trip detail modal -->
<div id="trip-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="trip-modal-title">
    <div class="modal-content">
        <button type="button" class="close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
        <div id="trip-detail">Cargando...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Fecha compacta (13/09/26, 17:38): con segundos y año completo la columna
// empujaba la tabla fuera de la pantalla en móvil.
function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('es-ES', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
    });
}

let viajes = [];
const PAGINA_VIAJES = 50;

async function loadTrips(reiniciar = true) {
    // Filtros de fecha (el API los acepta desde el goal de 2026-10) y paginación
    // de 50 en 50: traer 200 de golpe dejaba la página en 9.282 px en un móvil.
    const desde = document.getElementById('f-desde')?.value;
    const hasta = document.getElementById('f-hasta')?.value;
    const offset = reiniciar ? 0 : viajes.length;
    const q = new URLSearchParams({ limit: PAGINA_VIAJES, offset: offset });
    if (desde) q.set('from', desde);
    if (hasta) q.set('to', hasta);
    const r = await fetch('/api/trips?' + q.toString());
    const nuevos = await r.json();
    const total = parseInt(r.headers.get('X-Total-Count') || String(nuevos.length), 10);
    viajes = reiniciar ? nuevos : viajes.concat(nuevos);
    const trips = viajes;
    const resumen = document.getElementById('trips-resumen');
    if (resumen) resumen.textContent = `mostrando ${trips.length} de ${total}`;
    const mas = document.getElementById('mas-trips');
    if (mas) mas.style.display = trips.length < total ? 'inline-block' : 'none';
    const el = document.getElementById('trips-list');

    if (trips.length === 0) {
        el.innerHTML = '<p class="muted">Aún no hay viajes registrados. Conecta el VgateBridge y comienza a conducir.</p>';
        return;
    }

    // .table-wrap mantiene el scroll horizontal DENTRO de la tarjeta (si no, el
    // navegador móvil ensancha la página entera y todo se ve diminuto).
    // Vel. med y RPM max se ocultan en móvil: siguen en el detalle del viaje.
    let html = '<div class="table-wrap"><table><thead><tr><th>Inicio</th><th>Duración</th><th>Distancia</th><th>Vel. max</th><th class="hide-mobile">Vel. med</th><th class="hide-mobile">RPM max</th><th>Consumo</th><th>Estado</th><th>Mapa</th></tr></thead><tbody>';
    for (const t of trips) {
        const start = fmtDate(t.start_time);
        const dur = t.driving_minutes ? `${t.driving_minutes} min` : '—';
        // 12 sesiones quedaron con distance_km = 0 (arranque sin movimiento):
        // se dicen como tales en vez de un «—» que parece un fallo.
        const dist = t.distance_km ? `${t.distance_km.toFixed(1)} km`
            : (t.status === 'completed' ? '<span class="muted">sin mov.</span>' : '—');
        const maxSpd = t.max_speed ? `${t.max_speed.toFixed(0)} km/h` : '—';
        const avgSpd = t.avg_speed ? `${t.avg_speed.toFixed(0)} km/h` : '—';
        const maxRpm = t.max_rpm ? `${t.max_rpm.toFixed(0)} rpm` : '—';
        // El origen de la cifra va en el título: real de surtidor, estimación
        // MAF o nada. Antes se mezclaban sin decirlo.
        let cons = '—', consTitle = 'sin datos';
        if (t.consumo_l100 !== null && t.consumo_l100 !== undefined) {
            cons = t.consumo_l100.toFixed(1);
            consTitle = t.consumo_origen === 'real' ? 'real (surtidor)' : 'estimado (MAF)';
            if (t.consumo_origen !== 'real') cons += ' <span class="muted" style="font-size:11px;">est.</span>';
        }
        const status = t.status === 'active'
            ? '🟢<span class="hide-mobile"> Activo</span>'
            : '✅<span class="hide-mobile"> Completado</span>';
        html += `<tr onclick="showTrip(${t.id})" style="cursor:pointer">
            <td>${start}</td><td>${dur}</td><td>${dist}</td>
            <td>${maxSpd}</td><td class="hide-mobile">${avgSpd}</td><td class="hide-mobile">${maxRpm}</td>
            <td title="${consTitle}">${cons}</td>
            <td>${status}</td>
            <td><a href="/trip/${t.id}" onclick="event.stopPropagation()" title="Ficha del viaje">🔗</a>
                <a href="/map?session_id=${t.id}" onclick="event.stopPropagation()" title="Ver trazado en el mapa">🗺️</a></td>
        </tr>`;
    }
    html += '</tbody></table></div>';
    el.innerHTML = html;
}

async function showTrip(id) {
    const r = await fetch(`/api/trip/${id}`);
    const el = document.getElementById('trip-detail');
    if (!r.ok) {
        // 404: viaje inexistente (enlaces viejos de los resúmenes de viaje)
        el.innerHTML = `<h2 id="trip-modal-title">Viaje ${id}</h2>
            <p class="muted">Ese viaje no existe (puede haberse fusionado con otro o haberse reprocesado).</p>
            <p><a class="btn" href="/trips">Ver todos los viajes</a></p>`;
        document.getElementById('trip-modal').style.display = 'flex';
        return;
    }
    const d = await r.json();
    const t = d.trip;

    const start = t.start_time ? new Date(t.start_time).toLocaleString('es') : '—';
    const end = t.end_time ? new Date(t.end_time).toLocaleString('es') : '—';
    const dur = t.driving_minutes ? `${t.driving_minutes} min` : '—';
    const dist = t.distance_km ? `${t.distance_km.toFixed(2)} km` : '?';

    let html = `<h2 id="trip-modal-title">Viaje del ${start}</h2>
        <div class="stats-grid mini">
            <div class="stat-card"><div class="stat-label">Distancia</div><div class="stat-value">${dist}</div></div>
            <div class="stat-card"><div class="stat-label">Duración</div><div class="stat-value">${dur}</div></div>
            <div class="stat-card"><div class="stat-label">Vel. max</div><div class="stat-value">${t.max_speed?.toFixed(0) || '?'} km/h</div></div>
            <div class="stat-card"><div class="stat-label">RPM max</div><div class="stat-value">${t.max_rpm?.toFixed(0) || '?'}</div></div>
        </div>`;

    // Speed chart for this trip
    if (d.readings && d.readings.length > 0) {
        html += '<canvas id="tripChart" height="150"></canvas>';
    }

    // Tips for this trip
    if (d.tips && d.tips.length > 0) {
        html += '<h3>💡 Consejos del viaje</h3><ul>';
        for (const tip of d.tips) {
            const icon = tip.severity === 'warning' ? '⚠️' : tip.severity === 'info' ? 'ℹ️' : '💡';
            html += `<li>${icon} ${tip.message}</li>`;
        }
        html += '</ul>';
    }

    // DTCs
    if (d.dtcs && d.dtcs.length > 0) {
        html += '<h3>🔧 Códigos de error</h3><ul>';
        for (const dtc of d.dtcs) {
            html += `<li><strong>${dtc.code}</strong>: ${dtc.description || 'Sin descripción'}</li>`;
        }
        html += '</ul>';
    }

    el.innerHTML = html;
    document.getElementById('trip-modal').style.display = 'flex';

    // Draw chart
    if (d.readings && d.readings.length > 1) {
        setTimeout(() => {
            const cctx = document.getElementById('tripChart')?.getContext('2d');
            if (!cctx) return;
            new Chart(cctx, {
                type: 'line',
                data: {
                    labels: d.readings.map((_, i) => i),
                    datasets: [
                        { label: 'Velocidad', data: d.readings.map(r => r.speed || 0), borderColor: '#00ff88', fill: true, backgroundColor: 'rgba(0,255,136,0.1)', tension: 0.3 },
                        { label: 'Temp. °C', data: d.readings.map(r => r.coolant_temp || 0), borderColor: '#ff6633', borderDash: [5,5], fill: false, tension: 0.3, yAxisID: 'y1' },
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#ccc' } } },
                    scales: {
                        x: { ticks: { color: '#888', maxTicksLimit: 10 }, grid: { color: '#222' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#222' }, min: 0 },
                        y1: { position: 'right', ticks: { color: '#f63' }, grid: { display: false } }
                    }
                }
            });
        }, 100);
    }
}

function aplicarFechas() {
    loadTrips();
}

function limpiarFechas() {
    document.getElementById('f-desde').value = '';
    document.getElementById('f-hasta').value = '';
    loadTrips();
}

function closeModal() {
    document.getElementById('trip-modal').style.display = 'none';
    // Si se abrió por enlace directo (/trips?trip=123), se limpia la URL para
    // que recargar no vuelva a abrir el mismo viaje.
    if (new URLSearchParams(location.search).has('trip')) {
        history.replaceState(null, '', '/trips');
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

loadTrips();

// Enlace permanente a un viaje: /trips?trip=<id> abre su detalle.
// Es el destino de los enlaces que se ponen en los resúmenes de viaje.
const tripParam = parseInt(new URLSearchParams(location.search).get('trip'), 10);
if (!Number.isNaN(tripParam)) {
    showTrip(tripParam);
}
</script>
{% endblock %}
