name: CI

# Puertas del repo en el CI, no solo en local: hasta ahora obd-telemetry solo
# tenía los hooks de pre-commit de la máquina de desarrollo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependencias
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Sintaxis de los scripts del colector
        run: |
          python -m py_compile collector/*.py
          echo "py_compile OK"
